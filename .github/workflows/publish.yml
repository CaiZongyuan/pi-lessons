name: Publish docs

# Two pipelines meet in this workflow:
#
#   books/ ──▶ Python content tools ──▶ docs/src/content/docs/ ──▶ Astro ──▶ dist/ ──▶ Pages
#
# The Python side owns content (IR extraction, IR→Markdown, translation validation); Astro
# owns presentation. The steps stay explicit rather than hidden behind a composite action,
# because a content build and a site build fail for different reasons and the log should
# say which.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight deploy; two deploys must never race.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # ---- content validation ---------------------------------------------
      # Runs before the Node toolchain is installed so a broken translation fails in
      # seconds rather than after a full dependency install.
      - name: Validate translations
        run: |
          python tools/check.py
          python tools/check_md.py

      # ---- content sync ---------------------------------------------------
      # books/ is the source of truth. The content collection is generated from it and
      # is gitignored, so a clean checkout reproduces the site exactly.
      - name: Generate Starlight content
        run: |
          python tools/ir2md.py books/pi-durable/ir --out books/pi-durable/md/parts
          python tools/docs.py sync

      - name: Confirm generated content is current
        run: python tools/docs.py check

      # ---- site build -----------------------------------------------------
      # `npm install`, not `npm ci`: the lock file in this repo was generated on Windows
      # and carries only the win32 optional-dependency variants (rollup, sharp, esbuild).
      # `npm ci` installs exactly those and then fails on Linux with
      # "Cannot find module @rollup/rollup-linux-x64-gnu". `npm install` resolves the
      # optional deps for the runner's platform while still honouring the lock for
      # everything else. Regenerating the lock on Linux would fix `npm ci` but would
      # then break local installs on Windows — the site is built on both.
      - name: Install dependencies
        working-directory: docs
        run: npm install --no-audit --no-fund

      - name: Astro check
        working-directory: docs
        run: npx astro check

      - name: Build site
        working-directory: docs
        run: npm run build

      # ---- verify before publishing ----------------------------------------
      # A half-built site must never go live: the deploy job only runs if this passes.
      - name: Verify built site
        run: |
          python tools/verify_site.py docs/dist \
            --expect index.html \
            --expect 404.html \
            --expect sitemap-index.xml \
            --expect pi-manual/01-model/index.html \
            --expect pi-manual/08-reference/index.html \
            --expect pi-durable/01-model/index.html \
            --expect pi-durable/11-reference/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
