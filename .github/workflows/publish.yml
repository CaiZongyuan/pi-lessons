name: publish

# The render stage needs no source PDF: it consumes the translated IR that is committed
# under books/<id>/ir/. That keeps CI fast and lets the copyrighted PDFs stay out of the
# repository. Re-run `book.py extract` locally when a new PDF revision lands, commit the
# refreshed IR, and this workflow publishes it.

on:
  push:
    branches: [main]
    paths:
      - "books/**"
      - "tools/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate IR and translations
        run: python tools/check.py

      - name: Render every book that has translations
        run: |
          for id in $(python tools/book.py list --ids); do
            echo "::group::render $id"
            python tools/book.py render "$id"
            echo "::endgroup::"
          done

      - name: Regenerate landing page
        run: python tools/book.py index

      - name: Verify no broken asset references
        run: python tools/verify_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
